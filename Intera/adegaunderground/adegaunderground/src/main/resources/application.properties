spring.application.name=adegaunderground

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/adega_underground}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

app.security.swagger-public=${SWAGGER_PUBLIC:false}
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:AdegaUnderground}
app.security.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:2}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.ocr.api-key=${OCR_API_KEY}
app.ocr.url=${OCR_URL:https://api.ocr.space/parse/image}
app.ocr.max-file-size-bytes=${OCR_MAX_FILE_SIZE_BYTES:5242880}

server.error.include-message=never
server.error.include-stacktrace=never
